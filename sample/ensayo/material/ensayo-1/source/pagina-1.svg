<?xml version="1.0" encoding="UTF-8"?>
<!--
  La «foto» de ejemplo (035 T005).

  Es un SVG y no una fotografía, a propósito y no por comodidad: un dibujo es
  inspeccionable y una foto es opaca, que es el mismo argumento de `022` para los
  diagramas. Representa la hoja fotocopiada que ella traería — con la equis de letra del
  tercer ejercicio, que es el fallo que la lectura tiene que enseñarle a corregir.

  CC BY-SA 4.0.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 800" width="620" height="800">
  <rect width="620" height="800" fill="#f6f4ef"/>
  <rect x="28" y="28" width="564" height="744" fill="#fffdf8" stroke="#ded8cc" stroke-width="2"/>
  <g font-family="Georgia, serif" fill="#2b2b2b">
    <text x="60" y="92" font-size="27" font-weight="bold">Multiplicaciones</text>
    <text x="60" y="130" font-size="18">Nombre: ______________________  Fecha: ____________</text>
    <text x="60" y="188" font-size="19">Resuelve estas multiplicaciones y comprueba el resultado.</text>
    <text x="72" y="252" font-size="21">1.  3 × 6 = ______</text>
    <text x="72" y="308" font-size="21">2.  7 × 2 = ______</text>
    <!-- El fallo autorizado: aquí es una equis de letra, no el signo de multiplicar. -->
    <text x="72" y="364" font-size="21">3.  5 x 4 = ______</text>
    <text x="72" y="420" font-size="21">4.  8 × 5 = ______</text>
    <text x="60" y="492" font-size="19">Ahora estos problemas:</text>
    <text x="72" y="548" font-size="19">5.  En una caja caben 6 lápices.</text>
    <text x="96" y="578" font-size="19">¿Cuántos lápices hay en 4 cajas?</text>
    <text x="72" y="640" font-size="19">6.  Un paquete tiene 9 cromos.</text>
    <text x="96" y="670" font-size="19">¿Cuántos cromos hay en 3 paquetes?</text>
  </g>
  <text x="60" y="742" font-family="Georgia, serif" font-size="13" fill="#8a8378">
    Hoja de ejemplo · material inventado para probar Rampa · CC BY-SA
  </text>
</svg>
