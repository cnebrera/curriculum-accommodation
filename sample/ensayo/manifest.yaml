# El juego de ejemplo del modo ensayo (035 T005, FR-3307/3310).
#
# Escrito a mano y revisado como el corpus, nunca generado en el build: ésta es la única
# adaptación que va a ver todo el mundo que abra Rampa por primera vez, y una adaptación
# generada por una máquina para enseñar lo que hace una máquina no demuestra nada.
#
