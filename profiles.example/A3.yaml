# Example type-profile. Invented — not a real learner.
# Copy this shape into profiles/<CODE>.yaml, which is git-ignored.
# See docs/profile-schema.md.

code: A3

# 0 = no barrier · 1 = mild · 2 = moderate · 3 = severe or total
# Leave an axis null if you have not observed it. Do NOT default it to 0.
axes:
  PER-V: 0      # visual access
  PER-A: 0      # auditory access
  DEC: 2        # decoding
  LIN: 2        # linguistic comprehension
  COG: 3        # cognitive load
  ATE: 2        # attention
  EJE: 3        # executive function
  MOT: 1        # motor / response
  REG: 1        # sensory regulation
  CUR: 1        # curricular gap — significant adaptation only

works:
  - "One task per page, with blank space around it"
  - "Numbered steps that can be ticked off"
  - "First item already worked as an example"

interests: ["dinosaurs", "football"]

avoid:
  - "Dense pages with several exercises visible at once"
  - "Timed tasks"

response:
  default: short
  writing: "Dictates; an adult transcribes"

language:
  instruction: es

# Las notas NO van aquí. Viven en `profiles/<código>/notes.md`, que es el fichero que
# Rampa lee y al que añade lo que tú vas apuntando — un `notes:` en este fichero se
# descarta en el siguiente guardado (`saveProfile` lo quita), así que copiarlo desde aquí
# era perder lo que hubieras escrito. Corregido el 2026-09-05, encontrado por el test que
# por fin lee este directorio.
#
# Lo que iba aquí, para que se vea dónde va:
#
#   profiles/A3/notes.md
#   ---
#   ## 2026-09-05 · Cómo lee
#   Lee en voz alta con precisión pero pierde el hilo en preguntas con más de una
#   oración. Arranca mucho antes si el primer paso ya está hecho de ejemplo. Rechaza
#   las fichas que parecen «de pequeños»: el registro, de su edad.
