<!DOCTYPE html>
<html lang="$if(lang)$$lang$$else$es$endif$">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$if(title)$$title$$else$Material adaptado$endif$</title>
<!--
  Rampa output template. CC BY-SA 4.0.
  Presentation is driven by profile-derived metadata, not by hand-editing CSS.
  Set these in the adapted IR front matter under `render:`.
-->
<style>
  :root{
    --font-size: $if(render.fontsize)$$render.fontsize$$else$14pt$endif$;
    --line-height: $if(render.lineheight)$$render.lineheight$$else$1.7$endif$;
    --measure: $if(render.measure)$$render.measure$$else$60ch$endif$;
    --letter-spacing: $if(render.letterspacing)$$render.letterspacing$$else$0.01em$endif$;
    --word-spacing: $if(render.wordspacing)$$render.wordspacing$$else$0.05em$endif$;
    --para-gap: $if(render.paragap)$$render.paragap$$else$1.4em$endif$;
    --ink: $if(render.ink)$$render.ink$$else$#111$endif$;
    --paper: $if(render.paper)$$render.paper$$else$#fff$endif$;
    --accent: $if(render.accent)$$render.accent$$else$#0b5f5b$endif$;
    --rule: $if(render.rule)$$render.rule$$else$#c9d2d1$endif$;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family: $if(render.font)$"$render.font$", $endif$"Atkinson Hyperlegible","Verdana",ui-sans-serif,sans-serif;
    font-size:var(--font-size); line-height:var(--line-height);
    letter-spacing:var(--letter-spacing); word-spacing:var(--word-spacing);
  }
  main{max-width:var(--measure); margin:0 auto; padding:2.5rem 1.5rem 4rem;}
  p{margin:0 0 var(--para-gap);}
  h1,h2,h3{line-height:1.25; margin:2em 0 .6em; font-weight:700;}

  /* IR block classes. Each gets visible structure, not decoration. */
  .explanation{margin-bottom:var(--para-gap);}
  .example{border-left:4px solid var(--rule); padding-left:1em; margin:1.5em 0;}
  .instruction{font-weight:700; margin:1.8em 0 .8em;}
  .exercise, .assessment{
    border:2px solid var(--rule); border-radius:10px;
    padding:1.4em 1.5em; margin:1.6em 0;
  }
  .assessment{border-color:var(--accent);}
  .scaffold{background:#f4f7f7; border-radius:10px; padding:1.2em 1.4em; margin:1.4em 0;}
  .figure{margin:1.6em 0;}
  .figure img{max-width:100%; height:auto;}
  .figure blockquote{
    border-left:4px solid var(--accent); margin:.8em 0 0; padding:.2em 0 .2em 1em;
    font-size:.95em;
  }
  .note{font-size:.95em; border-left:4px solid var(--rule); padding-left:1em;}

  /* One task per page: set `render.onetaskperpage: true` from COG/ATE. */
  $if(render.onetaskperpage)$
  .exercise, .assessment{break-after:page; page-break-after:always;}
  $endif$

  /* Draft mark. Removed only by /rampa-review recording sign-off. */
  .draft-banner{
    position:sticky; top:0; z-index:10;
    background:#8a2f2c; color:#fff; padding:.7em 1.2em;
    font-weight:700; font-size:.9rem; letter-spacing:.04em; text-align:center;
  }
  @media print{
    .draft-banner{position:static;}
    $if(review.signed_off)$$else$
    main::before{
      content:"BORRADOR — PENDIENTE DE REVISIÓN";
      position:fixed; top:45%; left:0; right:0; text-align:center;
      font-size:3rem; color:rgba(138,47,44,.13); transform:rotate(-24deg);
      pointer-events:none; z-index:-1;
    }
    $endif$
  }
  a{color:var(--accent);}
  :focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
</style>
</head>
<body>
$if(review.signed_off)$$else$
<div class="draft-banner" role="status">
  BORRADOR — pendiente de revisión docente · no entregar al alumnado
</div>
$endif$
<main>
$body$
</main>
</body>
</html>
